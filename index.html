<!doctype html>
<html lang="en" data-mode="dark" data-region="windswept-hills">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >
  <meta
    name="description"
    content="Eolas Companion — an offline-first Palworld field journal."
  >
  <meta name="theme-color" content="#182017">

  <title>Eolas Companion</title>

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./css/tokens.css">
  <link rel="stylesheet" href="./css/app.css">
  <link rel="stylesheet" href="./css/components.css">

  <script type="module" src="./js/app.js"></script>
</head>

<body>
  <a class="skip-link" href="#app-view">Skip to journal</a>

  <div class="world-wash" aria-hidden="true"></div>

  <div class="app-shell">
    <aside class="guide-rail" aria-label="Field guide">
      <button class="journal-brand" type="button" data-route="home">
        <span class="brand-sigil" aria-hidden="true">E</span>
        <span>
          <strong>Eolas</strong>
          <small>Field Journal</small>
        </span>
      </button>

      <nav class="guide-nav" aria-label="Primary navigation">
        <button type="button" data-route="home">
          <span aria-hidden="true">✦</span>
          <span>Journal</span>
        </button>
        <button type="button" data-route="regions">
          <span aria-hidden="true">⌖</span>
          <span>World</span>
        </button>
        <button type="button" data-route="paldex">
          <span aria-hidden="true">◉</span>
          <span>Paldex</span>
        </button>
        <button type="button" data-route="bases">
          <span aria-hidden="true">⌂</span>
          <span>Bases</span>
        </button>
        <button type="button" data-route="settings">
          <span aria-hidden="true">⚙</span>
          <span>Settings</span>
        </button>
      </nav>

      <div class="rail-footer">
        <span id="connection-status" class="connection-status" role="status">
          Checking connection
        </span>
        <small>Iteration 02</small>
      </div>
    </aside>

    <div class="journal-stage">
      <header class="mobile-header">
        <button class="journal-brand" type="button" data-route="home">
          <span class="brand-sigil" aria-hidden="true">E</span>
          <span>
            <strong>Eolas</strong>
            <small>Field Journal</small>
          </span>
        </button>

        <button
          class="region-chip"
          id="region-shortcut"
          type="button"
          data-route="regions"
        >
          <span class="region-dot" aria-hidden="true"></span>
          <span id="active-region-label">Windswept Hills</span>
        </button>
      </header>

      <main id="app-view" class="app-view" tabindex="-1"></main>
    </div>

    <nav class="mobile-tabs" aria-label="Primary navigation">
      <button type="button" data-route="home">
        <span aria-hidden="true">✦</span>
        <small>Journal</small>
      </button>
      <button type="button" data-route="regions">
        <span aria-hidden="true">⌖</span>
        <small>World</small>
      </button>
      <button type="button" data-route="paldex">
        <span aria-hidden="true">◉</span>
        <small>Paldex</small>
      </button>
      <button type="button" data-route="bases">
        <span aria-hidden="true">⌂</span>
        <small>Bases</small>
      </button>
      <button type="button" data-route="settings">
        <span aria-hidden="true">⚙</span>
        <small>Settings</small>
      </button>
    </nav>
  </div>

  <noscript>
    <div class="noscript-message">Eolas Companion requires JavaScript.</div>
  </noscript>
</body>
</html>
